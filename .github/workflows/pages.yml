name: Publish QUANTA
on:
  push:
    branches: [main]
    paths: ['**.html', '**.css', '**.js', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download complete portfolio
        run: |
          curl --fail --location --retry 3 https://github.com/ashlyxf/ashlyxf.github.io/releases/download/v1.1.0/quanta-portfolio.zip --output portfolio.zip
          echo "67c1021cdbcc8d972f447d4d201afea9157921edc526a79e3fe5901f63f3520a  portfolio.zip" | sha256sum --check
          mkdir site
          unzip -q portfolio.zip -d site
          git archive HEAD | tar -x -C site
          test -f site/index.html
          test -f site/talos.html
          test -f site/assets/talos-l4-control-loop.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
